[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "struktura"
description = "DFA anomaly detection — 85x faster than Python. Predict failure before it happens."
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["anomaly-detection", "dfa", "time-series", "signal-processing"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
features = ["python"]
