name: 'struktura'
description: 'Run struktura DFA anomaly guard on a CSV in CI: zero-config drift/fault detection.'
branding:
  icon: 'activity'
  color: 'orange'

inputs:
  file:
    description: 'Path to the CSV file to check (one column per channel).'
    required: true
  version:
    description: 'struktura version to use. The prebuilt release binary for this exact version is downloaded; runners without one (e.g. Linux ARM64) build it with cargo install --locked.'
    required: false
    default: '1.8.7'
  fail-on-fault:
    description: 'Fail the step (exit non-zero) when struktura reports a fault.'
    required: false
    default: 'true'
  args:
    description: 'Extra flags passed through to `struktura guard` (e.g. "--baseline 500").'
    required: false
    default: ''

outputs:
  faults:
    description: 'Number of fault/alarm events struktura reported.'
    value: ${{ steps.run-guard.outputs.faults }}
  report:
    description: 'Path to the raw struktura JSON report written by this action.'
    value: ${{ steps.run-guard.outputs.report }}
  source:
    description: 'Where the struktura binary came from: local (./target/release), release (prebuilt download) or cargo (built with cargo install).'
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: 'composite'
  steps:
    # Order: a binary built in this checkout (uses: ./), then the prebuilt
    # GitHub release binary for the pinned version, then cargo install.
    # From 1.8.5 each release publishes SHA256SUMS and the download is
    # verified against it; older releases have none (a notice says so).
    - name: Resolve struktura binary
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -x "./target/release/struktura" ] || [ -x "./target/release/struktura.exe" ]; then
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          echo "source=local" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   asset=struktura-linux-x86_64 ;;
          macOS-ARM64) asset=struktura-macos-aarch64 ;;
          macOS-X64)   asset=struktura-macos-x86_64 ;;
          Windows-X64) asset=struktura-windows-x86_64.exe ;;
          *)           asset= ;;
        esac
        exe=struktura; [ "$RUNNER_OS" = "Windows" ] && exe=struktura.exe
        dir="$RUNNER_TEMP/struktura-bin"; mkdir -p "$dir"
        url="https://github.com/koscak-labs/struktura/releases/download/v${VERSION}/${asset}"
        if [ -n "$asset" ] && curl -fsSL --retry 3 -o "$dir/$exe" "$url"; then
          sums="https://github.com/koscak-labs/struktura/releases/download/v${VERSION}/SHA256SUMS"
          if curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$sums"; then
            # "hash  name" (text mode) or "hash *name" (binary mode)
            want=$(awk -v a="$asset" '{ n = $2; sub(/^\*/, "", n); if (n == a) print $1 }' "$dir/SHA256SUMS")
            # Hash from stdin: given a Windows path with backslashes, sha256sum
            # escapes the name and prefixes the line with "\", which broke the
            # comparison on Windows runners.
            if command -v sha256sum >/dev/null; then got=$(sha256sum < "$dir/$exe" | cut -d' ' -f1)
            else got=$(shasum -a 256 < "$dir/$exe" | cut -d' ' -f1); fi
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::sha256 mismatch for ${asset}: expected ${want:-<not listed>}, got ${got}"
              exit 1
            fi
            echo "struktura ${VERSION}: sha256 verified"
          else
            echo "::notice::v${VERSION} has no SHA256SUMS (released before 1.8.5); the binary is not checksum-verified"
          fi
          chmod +x "$dir/$exe"
          echo "$dir" >> "$GITHUB_PATH"
          echo "source=release" >> "$GITHUB_OUTPUT"
          echo "struktura ${VERSION}: downloaded ${asset}"
        else
          echo "source=cargo" >> "$GITHUB_OUTPUT"
          echo "struktura ${VERSION}: no release binary for ${RUNNER_OS}-${RUNNER_ARCH}, building with cargo"
        fi

    - name: Install Rust toolchain
      if: steps.resolve.outputs.source == 'cargo'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache struktura binary
      if: steps.resolve.outputs.source == 'cargo'
      id: cache-struktura
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/struktura*
        key: struktura-cargo-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install struktura with cargo
      if: steps.resolve.outputs.source == 'cargo' && steps.cache-struktura.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install struktura --version "${{ inputs.version }}" --locked

    - name: Run struktura guard
      id: run-guard
      shell: bash
      run: |
        set +e
        REPORT="${RUNNER_TEMP}/struktura-report.json"
        struktura guard "${{ inputs.file }}" --json ${{ inputs.args }} > "$REPORT" 2>&1
        EXIT_CODE=$?
        set -e

        cat "$REPORT"

        FAULTS=$(grep -c '"event":"alarm"' "$REPORT" || true)
        if [ -z "$FAULTS" ]; then FAULTS=0; fi

        echo "faults=$FAULTS" >> "$GITHUB_OUTPUT"
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"

        {
          echo "## struktura guard report"
          echo ""
          echo "File: \`${{ inputs.file }}\`"
          echo ""
          echo "Faults detected: **$FAULTS**"
          echo ""
          echo '```json'
          cat "$REPORT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$EXIT_CODE" -eq 2 ]; then
          echo "::error::struktura guard errored (exit 2), see report above"
          exit 2
        fi

        if [ "$EXIT_CODE" -eq 1 ] && [ "${{ inputs.fail-on-fault }}" = "true" ]; then
          echo "::error::struktura guard detected $FAULTS fault(s) in ${{ inputs.file }}"
          exit 1
        fi

        exit 0
