<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>struktura playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f0f12;
  --surface: #1a1a22;
  --border: rgba(255,255,255,0.08);
  --text: #fff;
  --dim: rgba(255,255,255,0.55);
  --green: #a8ff38;
  --red: #ff5e57;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--sans); padding: 24px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
h1 span { color: var(--green); }
.sub { color: var(--dim); font-size: 14px; margin-bottom: 24px; }
textarea {
  width: 100%; height: 180px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  font-family: var(--mono); font-size: 13px; resize: vertical;
}
textarea:focus { outline: none; border-color: var(--green); }
.actions { display: flex; gap: 12px; margin: 16px 0; align-items: center; }
button {
  background: var(--green); color: #000; border: none; padding: 10px 24px;
  border-radius: 6px; font-family: var(--sans); font-weight: 700; font-size: 14px;
  cursor: pointer;
}
button:hover { opacity: 0.9; }
button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.results { margin-top: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; margin-bottom: 12px;
}
.card h3 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--green); }
.stat.warn { color: #ffba3a; }
.stat.crit { color: var(--red); }
.stat-label { font-size: 12px; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.footer { margin-top: 32px; text-align: center; color: var(--dim); font-size: 12px; }
.footer a { color: var(--green); text-decoration: none; }
canvas { width: 100%; height: 200px; background: var(--surface); border-radius: 8px; margin-top: 12px; }
#status { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.demo-btn { font-size: 12px; padding: 6px 12px; }
</style>
</head>
<body>

<h1><span>struktura</span> playground</h1>
<p class="sub">paste numbers (one per line, or CSV) and see DFA anomaly detection live. runs in your browser via WebAssembly.</p>

<textarea id="input" placeholder="paste your data here — one number per line, or CSV (uses last column)

or click a demo below ↓"></textarea>

<div class="actions">
  <button onclick="runAnalysis()">analyze</button>
  <button class="secondary demo-btn" onclick="loadDemo('noise')">white noise</button>
  <button class="secondary demo-btn" onclick="loadDemo('bearing')">bearing fault</button>
  <button class="secondary demo-btn" onclick="loadDemo('shift')">regime shift</button>
  <span id="status"></span>
</div>

<div class="results" id="results"></div>

<div class="footer">
  <a href="https://github.com/koscak-labs/struktura">github</a> ·
  <a href="https://crates.io/crates/struktura">crates.io</a> ·
  <code>cargo add struktura</code>
</div>

<script>
// pure JS DFA implementation (no WASM dependency — works standalone)
function dfa(values) {
  const n = values.length;
  if (n < 64) return { alpha: 0.5, r_squared: 0.0 };

  const mean = values.reduce((a, b) => a + b, 0) / n;
  const profile = [];
  let cum = 0;
  for (let i = 0; i < n; i++) { cum += values[i] - mean; profile.push(cum); }

  const sMin = Math.max(16, Math.floor(n / 50));
  const sMax = Math.floor(n / 4);
  const ratio = Math.pow(sMax / sMin, 1 / 11);

  const logS = [], logF = [];
  let prevS = 0;
  for (let step = 0; step < 12; step++) {
    const s = Math.floor(sMin * Math.pow(ratio, step));
    if (s === prevS || s > sMax || s < 4) continue;
    prevS = s;

    let sumF2 = 0;
    const numSegs = Math.floor(n / s);
    for (let seg = 0; seg < numSegs; seg++) {
      const start = seg * s;
      let sy = 0, sj = 0, sj2 = 0, sjy = 0;
      for (let j = 0; j < s; j++) {
        const y = profile[start + j];
        sy += y; sj += j; sj2 += j * j; sjy += j * y;
      }
      const denom = s * sj2 - sj * sj;
      if (Math.abs(denom) < 1e-15) continue;
      const slope = (s * sjy - sj * sy) / denom;
      const intercept = (sy - slope * sj) / s;
      let resid = 0;
      for (let j = 0; j < s; j++) {
        const d = profile[start + j] - (intercept + slope * j);
        resid += d * d;
      }
      sumF2 += resid / s;
    }
    if (numSegs > 0) {
      logS.push(Math.log(s));
      logF.push(Math.log(Math.sqrt(sumF2 / numSegs)));
    }
  }

  if (logS.length < 3) return { alpha: 0.5, r_squared: 0.0 };

  // linear regression
  const nPts = logS.length;
  const sx = logS.reduce((a, b) => a + b, 0);
  const sy2 = logF.reduce((a, b) => a + b, 0);
  const sxx = logS.reduce((a, b) => a + b * b, 0);
  const sxy = logS.reduce((a, b, i) => a + b * logF[i], 0);
  const alpha = (nPts * sxy - sx * sy2) / (nPts * sxx - sx * sx);
  const ybar = sy2 / nPts;
  const ssTot = logF.reduce((a, b) => a + (b - ybar) ** 2, 0);
  const ssRes = logF.reduce((a, b, i) => {
    const pred = (sy2 - alpha * sx) / nPts + alpha * logS[i];
    return a + (b - pred) ** 2;
  }, 0);
  const r2 = ssTot > 0 ? 1 - ssRes / ssTot : 0;

  return { alpha, r_squared: r2 };
}

function parseData(text) {
  return text.trim().split('\n')
    .map(l => {
      const parts = l.trim().split(/[,\t;]/);
      return parseFloat(parts[parts.length - 1]);
    })
    .filter(v => !isNaN(v) && isFinite(v));
}

function lcg(seed) {
  let s = seed;
  return () => {
    s = (s * 6364136223846793005n + 1442695040888963407n) & 0xFFFFFFFFFFFFFFFFn;
    return Number(s >> 33n) / (1 << 31) - 0.5;
  };
}

function loadDemo(type) {
  const rng = lcg(42n);
  let data = [];
  if (type === 'noise') {
    for (let i = 0; i < 2048; i++) data.push(rng());
  } else if (type === 'bearing') {
    // healthy then degraded
    for (let i = 0; i < 1024; i++) data.push(rng() * 0.5 + Math.sin(i * 0.1) * 0.3);
    for (let i = 0; i < 1024; i++) data.push(rng() * 2.0 + Math.sin(i * 0.5) * 0.1);
  } else if (type === 'shift') {
    // regime shift at midpoint
    let s = 0;
    for (let i = 0; i < 1024; i++) { s += rng() * 0.1; data.push(s); }
    for (let i = 0; i < 1024; i++) data.push(rng());
  }
  document.getElementById('input').value = data.map(v => v.toFixed(6)).join('\n');
  runAnalysis();
}

function runAnalysis() {
  const text = document.getElementById('input').value;
  const values = parseData(text);
  const status = document.getElementById('status');

  if (values.length < 64) {
    status.textContent = 'need at least 64 data points';
    return;
  }
  status.textContent = `analyzing ${values.length} points...`;

  const t0 = performance.now();
  const result = dfa(values);
  const elapsed = (performance.now() - t0).toFixed(2);

  // compute anomaly scores (sliding window)
  const windowSize = Math.min(256, Math.floor(values.length / 4));
  const step = Math.floor(windowSize / 2);
  const scores = [];
  for (let i = 0; i + windowSize <= values.length; i += step) {
    const w = values.slice(i, i + windowSize);
    scores.push(dfa(w).alpha);
  }

  let verdict = 'HEALTHY';
  let verdictClass = '';
  if (scores.length > 3) {
    const baseline = scores.slice(0, Math.floor(scores.length / 3)).reduce((a, b) => a + b, 0) / Math.floor(scores.length / 3);
    const lastAlpha = scores[scores.length - 1];
    const shift = Math.abs(lastAlpha - baseline);
    if (shift > 0.15) { verdict = 'CRITICAL'; verdictClass = 'crit'; }
    else if (shift > 0.08) { verdict = 'WARNING'; verdictClass = 'warn'; }
    else if (shift > 0.03) { verdict = 'WATCH'; verdictClass = 'warn'; }
  }

  status.textContent = `${elapsed}ms`;

  document.getElementById('results').innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>scaling exponent</h3>
        <div class="stat">${result.alpha.toFixed(4)}</div>
        <div class="stat-label">α (DFA)</div>
      </div>
      <div class="card">
        <h3>fit quality</h3>
        <div class="stat">${result.r_squared.toFixed(4)}</div>
        <div class="stat-label">R²</div>
      </div>
      <div class="card">
        <h3>verdict</h3>
        <div class="stat ${verdictClass}">${verdict}</div>
        <div class="stat-label">${values.length} samples</div>
      </div>
      <div class="card">
        <h3>signal type</h3>
        <div class="stat" style="font-size:16px">${result.alpha < 0.4 ? 'anti-correlated' : result.alpha < 0.6 ? 'white noise' : result.alpha < 1.1 ? 'correlated (healthy)' : 'brownian / drift'}</div>
      </div>
    </div>
    <canvas id="plot"></canvas>
  `;

  drawPlot(scores);
}

function drawPlot(scores) {
  const canvas = document.getElementById('plot');
  if (!canvas || scores.length < 2) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 400;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth, h = 200;

  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(0, 0, w, h);

  const min = Math.min(...scores) - 0.05;
  const max = Math.max(...scores) + 0.05;

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 5; i++) {
    const y = 20 + (h - 40) * i / 4;
    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(w - 10, y); ctx.stroke();
  }

  // line
  ctx.strokeStyle = '#a8ff38';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < scores.length; i++) {
    const x = 40 + (w - 50) * i / (scores.length - 1);
    const y = 20 + (h - 40) * (1 - (scores[i] - min) / (max - min));
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // dots
  ctx.fillStyle = '#a8ff38';
  for (let i = 0; i < scores.length; i++) {
    const x = 40 + (w - 50) * i / (scores.length - 1);
    const y = 20 + (h - 40) * (1 - (scores[i] - min) / (max - min));
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // labels
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px "JetBrains Mono"';
  ctx.fillText(`α=${max.toFixed(2)}`, 2, 25);
  ctx.fillText(`α=${min.toFixed(2)}`, 2, h - 15);
  ctx.fillText('window →', w / 2 - 20, h - 3);
}
</script>
</body>
</html>
