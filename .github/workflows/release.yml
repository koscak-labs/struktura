name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: struktura-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: struktura-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: struktura-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: struktura-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/struktura${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
