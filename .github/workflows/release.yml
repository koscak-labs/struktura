name: Release

on:
  push:
    # Full versions only. `v*` also matched the floating `v1` Action tag, so
    # moving v1 started a release named "v1" (2026-09-24, cancelled).
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skip when the version is already on crates.io (e.g. published by hand),
      # so re-running a release does not fail on a duplicate upload.
      - run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "struktura-release (github.com/koscak-labs/struktura)" "https://crates.io/api/v1/crates/struktura/$v" >/dev/null; then
            echo "struktura $v already on crates.io; skipping publish"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: struktura-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: struktura-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: struktura-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: struktura-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Every target builds a file named `struktura`; rename so release assets don't collide.
      - run: cp target/${{ matrix.target }}/release/struktura${{ matrix.os == 'windows-latest' && '.exe' || '' }} ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      # One flat directory plus SHA256SUMS, which action.yml verifies.
      - name: Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Users run `uses: koscak-labs/struktura@v1`. Before v1 moves to this release,
  # run the action the way they do, against the binaries just published:
  # download, sha256 check, faults found on a known-fault CSV, on each OS.
  action-release-check:
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: guard
        uses: ./
        with:
          file: data/sylv_spike.csv
          version: ${{ steps.v.outputs.version }}
          fail-on-fault: false
      - shell: bash
        run: |
          SRC="${{ steps.guard.outputs.source }}"; FAULTS="${{ steps.guard.outputs.faults }}"
          echo "version=${{ steps.v.outputs.version }} source=$SRC faults=$FAULTS"
          [ "$SRC" = release ] || { echo "::error::expected source=release, got '$SRC'"; exit 1; }
          [ -n "$FAULTS" ] && [ "$FAULTS" -gt 0 ] || { echo "::error::expected faults > 0, got '$FAULTS'"; exit 1; }

  # Only after every OS passed. A push made with GITHUB_TOKEN starts no new
  # workflow runs, and the tag filter above excludes v1 anyway.
  move-v1:
    needs: action-release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin refs/tags/v1
          echo "v1 -> $GITHUB_SHA (${GITHUB_REF_NAME})"
