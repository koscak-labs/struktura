name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skip when the version is already on crates.io (e.g. published by hand),
      # so re-running a release does not fail on a duplicate upload.
      - run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "struktura-release (github.com/koscak-labs/struktura)" "https://crates.io/api/v1/crates/struktura/$v" >/dev/null; then
            echo "struktura $v already on crates.io; skipping publish"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: struktura-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: struktura-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: struktura-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: struktura-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Every target builds a file named `struktura`; rename so release assets don't collide.
      - run: cp target/${{ matrix.target }}/release/struktura${{ matrix.os == 'windows-latest' && '.exe' || '' }} ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      # One flat directory plus SHA256SUMS, which action.yml verifies.
      - name: Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
