name: Docker image

# ghcr.io/koscak-labs/struktura: the struktura CLI with nothing to install.
#   docker run --rm -v "$PWD:/data" ghcr.io/koscak-labs/struktura guard /data/file.csv
# Each architecture builds on a native runner (no emulation) and is smoke-tested
# before anything is pushed. Pushing happens only for v<major>.<minor>.<patch>
# tags (or a manual run); pull requests build and smoke-test only.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['Dockerfile', '.github/workflows/docker.yml', 'src/**', 'Cargo.toml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag such as v1.8.4, or a commit)'
        required: true
      version:
        description: 'Image version tag to push (such as 1.8.4)'
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      push: ${{ steps.mode.outputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: struktura:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test
        run: |
          docker run --rm struktura:smoke --help | head -3
          set +e
          docker run --rm -v "$PWD/data:/data" struktura:smoke guard /data/sylv_spike.csv --json > report.json
          rc=$?
          set -e
          alarms=$(grep -c '"event":"alarm"' report.json || true)
          echo "guard exit=$rc alarms=$alarms"
          [ "$rc" -eq 1 ] && [ "$alarms" -gt 0 ] || { echo "::error::expected exit 1 with alarms on sylv_spike.csv"; cat report.json; exit 1; }
      - name: Log in to ghcr.io
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: steps.mode.outputs.push == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Record digest
        if: steps.mode.outputs.push == 'true'
        run: |
          mkdir -p digests
          d="${{ steps.push.outputs.digest }}"
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.push == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          v="${VERSION#v}"
          test "$(ls digests | wc -l)" -eq 2 || { echo "::error::expected 2 digests"; ls digests; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$v" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " $(ls digests))
          docker buildx imagetools inspect "$IMAGE:$v"
