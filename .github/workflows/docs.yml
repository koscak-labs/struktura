name: Deploy docs
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: cargo install mdbook
      - name: Build docs
        run: cd docs && mdbook build
      # The playground runs the real monitor: build it to WebAssembly.
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build playground wasm
        run: cd playground/wasm && wasm-pack build --target web --release --out-dir ../pkg
      - name: Playground numbers match the claims ledger
        run: node scripts/check-playground.mjs playground/pkg
      - name: Copy playground into docs
        run: |
          mkdir -p docs/book/playground
          cp playground/index.html docs/book/playground/
          cp -r playground/pkg docs/book/playground/pkg
          rm -f docs/book/playground/pkg/.gitignore
      - name: Build the CSV page (released struktura-wasm, web target)
        run: |
          (cd crates/struktura-wasm && wasm-pack build --target web --release --out-dir ../../playground/csv/pkg)
          mkdir -p docs/book/playground/csv
          cp playground/csv/index.html playground/csv/app.js playground/csv/analysis.js docs/book/playground/csv/
          cp -r playground/csv/pkg docs/book/playground/csv/pkg
          rm -f docs/book/playground/csv/pkg/.gitignore
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
