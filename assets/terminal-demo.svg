<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    .bg { fill: #1a1b26; }
    .bar { fill: #2d2d3d; rx: 8; ry: 8; }
    .dot { r: 6; }
    .r { fill: #ff5f57; }
    .y { fill: #febc2e; }
    .g { fill: #28c840; }
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Menlo', monospace; font-size: 13px; fill: #c0caf5; }
    .bold { font-weight: bold; fill: #ffffff; }
    .green { fill: #9ece6a; }
    .red { fill: #f7768e; font-weight: bold; }
    .dim { fill: #565f89; }
    .cyan { fill: #7dcfff; }
    .prompt { fill: #bb9af7; }
  </style>

  <rect class="bg" width="720" height="420" rx="10"/>
  <rect class="bar" width="720" height="32" rx="10"/>
  <circle class="dot r" cx="20" cy="16"/>
  <circle class="dot y" cx="40" cy="16"/>
  <circle class="dot g" cx="60" cy="16"/>
  <text x="320" y="20" text-anchor="middle" class="dim" font-size="12">struktura — voyager</text>

  <text x="16" y="60" class="prompt">$</text>
  <text x="30" y="60" class="bold"> struktura voyager</text>

  <text x="16" y="90" class="bold">  VOYAGER 1 STRUCTURAL HEALTH ANALYSIS</text>
  <text x="16" y="110" class="dim">  ====================================================================</text>

  <text x="16" y="140" class="dim">  Data: NASA SPDF, L.F. Burlaga, VIM 48-second averages</text>

  <rect x="16" y="160" width="360" height="14" rx="2" fill="#9ece6a" opacity="0.8"/>
  <text x="390" y="172"> 2021 (healthy)    α=0.989  R²=0.9869</text>

  <rect x="16" y="185" width="290" height="14" rx="2" fill="#9ece6a" opacity="0.5"/>
  <rect x="306" y="185" width="70" height="14" rx="2" fill="#2d2d3d"/>
  <text x="390" y="197"> 2022 (anomaly)    α=0.801  R²=0.9681</text>

  <text x="390" y="222" class="red">                  shift=-0.187  CRITICAL</text>

  <text x="16" y="252" class="dim">  ====================================================================</text>
  <text x="16" y="275">  Baseline alpha:  0.989  <tspan class="dim">(2021 healthy operation)</tspan></text>
  <text x="16" y="295">  Anomaly alpha:   0.801  <tspan class="dim">(May-Jul 2022 AACS anomaly)</tspan></text>

  <text x="16" y="330">  The magnetic field's fractal structure changed</text>
  <text x="16" y="350">  during the anomaly — detectable from public NASA</text>
  <text x="16" y="370">  data, zero training, zero ML.</text>

  <text x="16" y="405" class="prompt">$</text>
  <text x="30" y="405" class="dim"> _</text>
</svg>
