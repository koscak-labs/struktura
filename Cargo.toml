[package]
name = "struktura"
version = "1.3.0"
edition = "2021"
rust-version = "1.70"
description = "Predict failure before it happens. Universal anomaly detection via DFA scaling analysis — spacecraft, bearings, biomedical signals. Zero dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/koscak-labs/struktura"
documentation = "https://docs.rs/struktura"
homepage = "https://koscak-labs.github.io/struktura"
keywords = ["anomaly-detection", "dfa", "time-series", "health-monitor", "fractal"]
categories = ["science", "algorithms"]
readme = "README.md"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
libm = "0.2"

[dev-dependencies]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
