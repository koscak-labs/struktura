[package]
name = "struktura"
version = "1.8.6"
edition = "2021"
rust-version = "1.70"
description = "Time-series anomaly detection with no training data: detrended fluctuation analysis (DFA, Hurst exponent), a self-calibrating streaming monitor for sensors and telemetry, and C99 code generation for embedded and flight software. no_std."
license = "MIT OR Apache-2.0"
repository = "https://github.com/koscak-labs/struktura"
documentation = "https://docs.rs/struktura"
homepage = "https://koscak-labs.github.io/struktura"
keywords = ["anomaly-detection", "time-series", "hurst", "telemetry", "changepoint"]
categories = ["science", "algorithms", "no-std", "aerospace", "embedded"]
readme = "README.md"
exclude = ["data/genome/", "data/heliopause/", "data/ims/", "data/ims_2nd_*", "data/ims_monitor_*", "data/ims/extracted/", "data/smap_msl/", "data/austen_shuffled.txt", "data/voyager1_2021_healthy.csv", "data/bench_*", "data/_bench_*", "data/sylv_*", "data/esa-adb/", "docs/", "test-ogma-*", "node_modules/", "*.dat", "*.zip", "assets/", "social-preview.*", "PROMOTION_*", "PROMO_*", "DRAFT_*", "ogma-template/", "examples/rover.csv", "PAPER_DRAFT.md", "esa-adb/", "playground/", "crates/", "bench/", "DFA_DISCOVERIES.md", "RIEMANN_FINDING.md"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[lib]
# rlib only. Observed in 1.7.2 with crate-type = ["lib", "cdylib", "staticlib"]:
# a dependent using `default-features = false` failed to build with
#   error: no global memory allocator found but one is required
#   error: `#[panic_handler]` function required, but not found
#   error: unwinding panics are not supported without std
# and built cleanly once the list was reduced to ["lib"] (see docs/evidence/).
# The C artifacts are built on demand instead:
#   cargo rustc --lib --release --crate-type cdylib --crate-type staticlib
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
libm = "0.2"

[dev-dependencies]
anomaly_detection = "0.3.1"
proptest = "1"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "comparison"
path = "examples/comparison.rs"
